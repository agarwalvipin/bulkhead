name: Validate Schemas

on:
  push:
    branches: [ main ]
    paths:
      - 'examples/python-fastapi-jwt/architecture/**/*.json'
      - 'schemas/**/*.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/python-fastapi-jwt/architecture/**/*.json'
      - 'schemas/**/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install AJV CLI
        run: npm install -g ajv-cli

      - name: Validate Phase 0 (Triage)
        run: |
          ajv validate -s schemas/triage-decision.schema.json -d examples/python-fastapi-jwt/architecture/00-triage.json

      - name: Validate Phase 1 (Context)
        run: |
          ajv validate -s schemas/context-spec.schema.json -d examples/python-fastapi-jwt/architecture/01-context.json

      - name: Validate Phase 2 (Design)
        run: |
          ajv validate -s schemas/design-spec.schema.json -d examples/python-fastapi-jwt/architecture/02-design.json

      - name: Validate Phase 3 (Security)
        run: |
          ajv validate -s schemas/security-report.schema.json -d examples/python-fastapi-jwt/architecture/03-security.json

      - name: Validate Phase 4 (Decision)
        run: |
          ajv validate -s schemas/decision-record.schema.json -d examples/python-fastapi-jwt/architecture/04-decision.json

      - name: Validate Phase 5 (Plan)
        run: |
          ajv validate -s schemas/execution-plan.schema.json -d examples/python-fastapi-jwt/architecture/05-plan.json
